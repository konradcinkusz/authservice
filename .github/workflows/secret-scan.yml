name: Secret scan

# Mandatory under P5 of the architecture standard, and more so here than in most
# repositories: this service holds the signing key for an identity system, and its README
# and docs are full of example configuration that a copy-paste could turn into a real
# credential.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in the tip commit is still a leaked secret.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
