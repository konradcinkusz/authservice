name: Secret scan

# P5 of the architecture standard makes this mandatory, and is blunt about why it is a job
# rather than a review habit: "a repository without one is assumed to contain credentials
# until proven otherwise". The violations it names are ordinary — property literals, a
# committed appsettings.json, and doc comments written to say what a value is.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in the tip commit is still a leaked secret, and
          # scanning only the working tree would call that clean.
          fetch-depth: 0

      # The container rather than gitleaks-action, deliberately. The action additionally
      # enumerates a pull request's commits through the API and fails the job with
      # "Resource not accessible by integration" without pull-requests:read — a permission
      # a secret scanner has no reason to hold. This runs the same scanner over the same
      # history and needs nothing but the checkout.
      - name: Scan history
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest detect \
            --source=/repo \
            --config=/repo/.gitleaks.toml \
            --redact \
            --no-banner \
            --verbose
