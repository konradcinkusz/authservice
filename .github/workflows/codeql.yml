name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query finds old code without waiting for a push.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-and-quality

      - name: Build
        run: dotnet build AuthService.sln --configuration Release

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
          # Written to a predictable path so the run below can keep it.
          output: sarif-results

      # The Security tab is the primary view, but it is only visible to accounts with
      # write access — which leaves contributors, and anyone triaging from a CI log,
      # unable to see what a failing CodeQL check actually found. The SARIF has rule
      # ids, file paths, line numbers and the full data-flow path for every alert, so
      # keeping it as an artifact makes the findings reviewable by anyone who can read
      # the run.
      - name: Upload SARIF results as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: sarif-results/*.sarif
          if-no-files-found: warn
