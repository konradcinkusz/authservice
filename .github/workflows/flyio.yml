name: Fly.io CI/CD

# ─────────────────────────────────────────────────────────────────────────────
# Triggered automatically on every v* tag push (i.e. whenever a GitHub Release
# is published against a new tag). Can also be run manually via workflow_dispatch.
#
# Flow:
#   deploy-postgres  ──┐
#   build             ──┴──▶  deploy-authservice
#
# Secrets scope: Settings > Environments > production
# Required secrets:
#   FLY_API_TOKEN            — Fly.io deploy token (flyctl auth token / fly tokens create deploy)
#   POSTGRES_PASSWORD        — Password for the authservice Postgres app
#   JWT_SECRET                — Symmetric signing key for access tokens (32+ chars)
# Optional secrets (safe to leave unset — the service starts fine without them):
#   OAUTH_GOOGLE_CLIENT_ID / OAUTH_GOOGLE_CLIENT_SECRET
#   OAUTH_GITHUB_CLIENT_ID / OAUTH_GITHUB_CLIENT_SECRET
#   SENDGRID_API_KEY / SENDGRID_FROM_EMAIL / SENDGRID_FROM_NAME
#   INITIAL_ADMIN_EMAIL / INITIAL_ADMIN_PASSWORD
# Optional variables (Settings > Environments > production > Variables):
#   CORS_ALLOWED_ORIGIN       — Frontend origin allowed to call this API
#
# The Fly app names below ("authservice" / "authservice-postgres") must be
# globally unique on Fly.io. If they're already taken, change APP_AUTHSERVICE /
# APP_POSTGRES below (and the `app = "..."` lines in flyio/*.fly.toml) before
# the first deploy.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  group: flyio-deploy
  cancel-in-progress: false

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLY_REGION: "fra"
  TAG: ${{ github.ref_name }}
  APP_AUTHSERVICE: authservice
  APP_POSTGRES: authservice-postgres
  POSTGRES_VOLUME: authservice_postgres_data

jobs:
  # ============================================================
  # PostgreSQL — idempotent: skips app/volume creation if they
  # already exist, safe to re-run on every deploy.
  # ============================================================
  deploy-postgres:
    name: PostgreSQL
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure PostgreSQL app exists
        run: |
          if flyctl apps list --json | grep -q '"${{ env.APP_POSTGRES }}"'; then
            echo "App ${{ env.APP_POSTGRES }} already exists"
          else
            flyctl apps create "${{ env.APP_POSTGRES }}" --org personal --yes
          fi

      - name: Validate PostgreSQL password secret
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "ERROR: environment secret POSTGRES_PASSWORD is missing or empty."
            echo "Set it in Settings > Environments > production > Secrets before deploying."
            exit 1
          fi
          echo "::add-mask::$POSTGRES_PASSWORD"

      - name: Ensure PostgreSQL volume exists
        run: |
          if flyctl volumes list --app "${{ env.APP_POSTGRES }}" --json | grep -q '"${{ env.POSTGRES_VOLUME }}"'; then
            echo "Volume ${{ env.POSTGRES_VOLUME }} already exists"
          else
            flyctl volumes create "${{ env.POSTGRES_VOLUME }}" \
              --app "${{ env.APP_POSTGRES }}" \
              --region "${{ env.FLY_REGION }}" \
              --size 3 \
              --yes
          fi

      - name: Set secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          flyctl secrets set \
            "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
            --app "${{ env.APP_POSTGRES }}"

      - name: Deploy PostgreSQL
        run: |
          flyctl deploy \
            --config flyio/postgres.fly.toml \
            --app "${{ env.APP_POSTGRES }}" \
            --remote-only \
            --ha=false \
            --wait-timeout 300 \
            .

      - name: Wait for PostgreSQL to initialize
        run: |
          echo "Waiting 20s for PostgreSQL to finish initializing..."
          sleep 20

  # ============================================================
  # Build & push the AuthService image, runs in parallel with
  # deploy-postgres.
  # ============================================================
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - uses: docker/setup-buildx-action@v3

      - name: Ensure Fly.io app exists
        run: |
          if flyctl apps list --json | grep -q '"${{ env.APP_AUTHSERVICE }}"'; then
            echo "App ${{ env.APP_AUTHSERVICE }} already exists"
          else
            flyctl apps create "${{ env.APP_AUTHSERVICE }}" --org personal --yes
          fi

      - name: Authenticate Docker to registry.fly.io
        run: flyctl auth docker

      - name: Build and push AuthService
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/AuthService/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            registry.fly.io/${{ env.APP_AUTHSERVICE }}:${{ env.TAG }}
            registry.fly.io/${{ env.APP_AUTHSERVICE }}:latest
          cache-from: type=gha,scope=flyio-authservice
          cache-to: type=gha,mode=max,scope=flyio-authservice

  # ============================================================
  # AuthService — depends on both the image being pushed and
  # PostgreSQL being reachable.
  # ============================================================
  deploy-authservice:
    name: AuthService
    runs-on: ubuntu-latest
    environment: production
    needs: [build, deploy-postgres]
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          echo "::add-mask::$POSTGRES_PASSWORD"
          flyctl secrets set \
            "Jwt__SecretKey=${{ secrets.JWT_SECRET }}" \
            "ConnectionStrings__DefaultConnection=Host=${{ env.APP_POSTGRES }}.internal;Port=5432;Database=authservice;Username=authservice;Password=${POSTGRES_PASSWORD};SSL Mode=Disable;Timeout=60" \
            "OAuth__Google__ClientId=${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}" \
            "OAuth__Google__ClientSecret=${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}" \
            "OAuth__GitHub__ClientId=${{ secrets.OAUTH_GITHUB_CLIENT_ID }}" \
            "OAuth__GitHub__ClientSecret=${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}" \
            "OAuth__CallbackBaseUrl=https://${{ env.APP_AUTHSERVICE }}.fly.dev" \
            "SendGrid__ApiKey=${{ secrets.SENDGRID_API_KEY }}" \
            "SendGrid__FromEmail=${{ secrets.SENDGRID_FROM_EMAIL }}" \
            "SendGrid__FromName=${{ secrets.SENDGRID_FROM_NAME }}" \
            "InitialAdmin__Email=${{ secrets.INITIAL_ADMIN_EMAIL }}" \
            "InitialAdmin__Password=${{ secrets.INITIAL_ADMIN_PASSWORD }}" \
            "Cors__AllowedOrigins__0=${{ vars.CORS_ALLOWED_ORIGIN }}" \
            --app ${{ env.APP_AUTHSERVICE }} \
            --stage

      - name: Deploy
        run: |
          flyctl deploy \
            --config flyio/authservice.fly.toml \
            --app ${{ env.APP_AUTHSERVICE }} \
            --image registry.fly.io/${{ env.APP_AUTHSERVICE }}:${{ env.TAG }} \
            --ha=false \
            --wait-timeout 300
