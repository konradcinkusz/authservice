name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore AuthService.sln

      - name: Build
        run: dotnet build AuthService.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test AuthService.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # The codebase is consistently formatted today and nothing enforced it, so the first
      # outside contribution was where drift would start.
      - name: Verify formatting
        run: dotnet format AuthService.sln --verify-no-changes --severity error

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # dotnet-ef reads project metadata rather than building the whole solution, so it does
      # not restore on its own — without this it fails on a missing project.assets.json for
      # the migration assemblies, which have never been restored in this job.
      - name: Restore
        run: dotnet restore AuthService.sln

      # The guard that matters once a migration set exists: a model change without a
      # matching migration is invisible under EnsureCreated and fails at runtime under
      # Migrate, which is the failure mode issue #17 is about.
      #
      # It is a no-op until a set is committed, deliberately. Generating one needs the
      # startup project to reference the migrations assembly so `dotnet ef` can load it, and
      # the migrations assembly already references the startup project for the DbContext
      # type — a cycle that cannot be broken while ApplicationDbContext lives in the
      # application project. See docs/schema/README.md; the fix is a structural change, not
      # a CI flag, and pretending otherwise here would just leave a job that always fails.
      - name: Migrations match the model
        run: |
          set -euo pipefail

          any=false
          for provider in PostgreSQL SqlServer; do
            if compgen -G "src/AuthService.Migrations.${provider}/*.cs" > /dev/null; then
              any=true

              echo "── ${provider} ──"
              DATABASE_PROVIDER="${provider}" \
              Database__MigrationsAssembly="AuthService.Migrations.${provider}" \
              dotnet ef migrations has-pending-model-changes \
                --project "src/AuthService.Migrations.${provider}" \
                --startup-project src/AuthService \
                --context ApplicationDbContext
            fi
          done

          if [ "$any" = true ]; then
            echo "Migrations are in sync with the model."
          else
            echo "No migration set committed; nothing to verify."
            echo "Database:SchemaMode stays on EnsureCreated until one exists."
          fi

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # The production Dockerfile was previously only exercised by the release workflow,
      # which runs on v* tags — so until the first tag existed it had never been built at all.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/AuthService/Dockerfile
          push: false
          load: true
          tags: authservice:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          # The service must fail fast and say which setting is missing, rather than starting
          # in a broken state — this asserts that guard still works in the built image.
          set +e
          output=$(docker run --rm -e ASPNETCORE_ENVIRONMENT=Production authservice:ci 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ $status -eq 0 ]; then
            echo "::error::Expected the service to fail without a connection string"
            exit 1
          fi
          echo "$output" | grep -q "DefaultConnection" || {
            echo "::error::Startup failure did not name the missing setting"
            exit 1
          }
