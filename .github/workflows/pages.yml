name: Deploy GitHub Pages

# ─────────────────────────────────────────────────────────────────────────────
# Publishes docs/index.html (the project one-pager) to GitHub Pages. Only
# fires when docs/ actually changes, so an unrelated push to main (README
# tweaks, application code) doesn't trigger a redeploy of a page that didn't
# change.
#
# One-time prerequisite this workflow can't do for you: Settings → Pages →
# Source must be set to "GitHub Actions" (not "Deploy from a branch") for
# actions/deploy-pages to have anywhere to deploy to. Also requires the repo
# to be public, or a paid GitHub plan — same as GitHub Pages generally.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
