# gitleaks configuration. Extends the default rule set rather than replacing it.

[extend]
useDefault = true

[allowlist]
description = "Deliberately weak, publicly documented evaluation credentials"

paths = [
  # docker-compose.yml and the demo docs ship weak credentials on purpose, and say so.
  # SECURITY.md lists findings against them as out of scope.
  '''docker-compose\.yml''',
  '''DEMO\.md''',
  '''src/AuthService/appsettings\.Development\.json''',
]
