# Fly.io configuration for AuthService.
# Deployed by .github/workflows/flyio.yml on every v* tag push (i.e. every GitHub Release).
app = "authservice"
primary_region = "fra"

[build]
  dockerfile = "../src/AuthService/Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS = "http://+:8080"
  DatabaseProvider = "PostgreSQL"
  Jwt__Issuer = "AuthService"
  Jwt__Audience = "AuthService"
  # Fly sets this header itself and strips any client-supplied copy, so unlike
  # X-Forwarded-For it is a trustworthy partition key for per-IP rate limiting.
  Network__ClientIpHeader = "Fly-Client-IP"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

# Readiness, not liveness: /health answers 200 the moment Kestrel binds, which would let
# Fly route live traffic at a machine whose schema is still being created — or whose
# initialization failed outright. /health/ready returns 503 until the database is genuinely
# usable, so a broken machine is never promoted during a rolling deploy.
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"
  method = "GET"
  path = "/health/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
