<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="authservice">
  <title>authservice</title>
  <!--
    The mark alone: a shield with the keyhole knocked out rather than filled, so the
    page background shows through and the same file sits correctly on light and dark.
    Indigo matches the accent token in docs/index.html.
  -->
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <mask id="keyhole">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="32" cy="26" r="6" fill="#000"/>
      <path d="M29.4 30.2h5.2l1.5 12.4a1.7 1.7 0 0 1-1.7 1.9h-4.8a1.7 1.7 0 0 1-1.7-1.9z" fill="#000"/>
    </mask>
  </defs>
  <path d="M32 5.4 53.2 12.6V30.6C53.2 42.4 45.4 51.5 32 57.4 18.6 51.5 10.8 42.4 10.8 30.6V12.6Z"
        fill="url(#shield)" stroke="url(#shield)" stroke-width="3.6" stroke-linejoin="round"
        mask="url(#keyhole)"/>
</svg>
