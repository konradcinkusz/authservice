<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 72" width="246" height="72" role="img" aria-label="authservice — JWT auth for ASP.NET Core">
  <title>authservice — JWT auth for ASP.NET Core</title>
  <!--
    Light-mode lockup: mark plus wordmark. The dark-mode twin is logo-dark.svg; the
    README picks between them with a <picture> element. The wordmark is set with
    textLength so it occupies the same width whichever system font renders it.
  -->
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <!-- Mask content is in the mark's own 0–64 space: the masked path sits inside the
         same transformed group, so no second transform belongs here. -->
    <mask id="keyhole">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="32" cy="26" r="6" fill="#000"/>
      <path d="M29.4 30.2h5.2l1.5 12.4a1.7 1.7 0 0 1-1.7 1.9h-4.8a1.7 1.7 0 0 1-1.7-1.9z" fill="#000"/>
    </mask>
  </defs>
  <g transform="translate(2 6.6) scale(0.9375)">
    <path d="M32 5.4 53.2 12.6V30.6C53.2 42.4 45.4 51.5 32 57.4 18.6 51.5 10.8 42.4 10.8 30.6V12.6Z"
          fill="url(#shield)" stroke="url(#shield)" stroke-width="3.6" stroke-linejoin="round"
          mask="url(#keyhole)"/>
  </g>
  <text x="68" y="38" textLength="172" lengthAdjust="spacingAndGlyphs" fill="#16181d"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="700">authservice</text>
  <text x="69" y="57" textLength="168" lengthAdjust="spacingAndGlyphs" fill="#5b616e"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="11" font-weight="600">JWT AUTH FOR ASP.NET CORE</text>
</svg>
